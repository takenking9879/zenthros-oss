name: release

# A tag v* is a release: what the installers download (install/stage.sh:
# the agent, zenadm, the unpacker, containerd and runc at their pins,
# install-agent.sh, install-container.sh, the agent's chart, SHA256SUMS),
# the SDK's wheel, and the agent's image on GHCR. The release's own URL is
# the install base a hub points its machines at; the digests the stage
# prints are what the hub pins.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: operator/go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: sdk/python/.python-version
      - run: sudo apt-get install -y zstd
      - name: What the installers download
        env:
          ZENTHROS_RELEASE: ${{ github.ref_name }}
          ZENTHROS_STAGE_INSTALL_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: bash install/stage.sh "${RUNNER_TEMP}/release" | tee "${RUNNER_TEMP}/digests.txt"
      - name: The SDK's wheel
        run: |
          python -m pip install "$(grep '^build==' sdk/python/requirements-dev.txt)"
          python -m build --wheel --outdir "${RUNNER_TEMP}/wheel" sdk/python
          (cd "${RUNNER_TEMP}/wheel" && sha256sum ./*.whl | sed 's/^/wheel_sha256=/') >> "${RUNNER_TEMP}/digests.txt"
      - name: The agent's image
        env:
          ZENTHROS_RELEASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          image="$(bash install/publish-agent-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}/agent:${GITHUB_REF_NAME}")"
          echo "agent_image=${image}" >> "${RUNNER_TEMP}/digests.txt"
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install base: https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/digests.txt"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}"/release/* "${RUNNER_TEMP}"/wheel/*.whl \
            --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
