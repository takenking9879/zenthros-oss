name: ci

# The agent's packages and the SDK, on every push and pull request. The SDK
# on Linux, macOS and Windows with the oldest and the newest Python it
# supports: the unit suite with the pins of requirements-dev.txt, then the
# wheel as a person installs it (scripts/os_smoke.py).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: operator/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  sdk:
    name: sdk ${{ matrix.os }} python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/python
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[s3,gcs,seal]" -r requirements-dev.txt
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: python -m ruff check .
      - name: Unit suite
        env:
          ZENTHROS_DEV_ENV: pins
          PYTHONPATH: tests
        run: python scripts/run_tests.py tests
      - name: The wheel, as a person installs it
        # RUNNER_TEMP with "/": Windows' "\" would be escapes in bash.
        run: |
          tmp="$(python -c 'import os; print(os.environ["RUNNER_TEMP"].replace(chr(92), "/"))')"
          python -m build --wheel --outdir "${tmp}/dist" .
          python -m venv "${tmp}/person"
          bin="${tmp}/person/bin"
          [ -d "${bin}" ] || bin="${tmp}/person/Scripts"
          "${bin}/python" -m pip install "${tmp}"/dist/*.whl
          "${bin}/python" -I scripts/os_smoke.py
