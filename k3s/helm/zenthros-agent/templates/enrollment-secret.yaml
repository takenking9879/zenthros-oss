{{- if not .Values.agent.local.enabled }}
{{- if .Values.enrollment.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.enrollment.tokenSecretName }}
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.enrollment.token | quote }}
  ca-cert-hash: {{ .Values.enrollment.caCertHash | quote }}
{{- end }}
{{- end }}
