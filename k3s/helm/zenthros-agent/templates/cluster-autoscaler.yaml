{{- if not .Values.agent.local.enabled }}
{{- if .Values.clusterAutoscaler.enabled }}
{{- if not .Values.agent.nodeSupply.enabled }}
{{- fail "clusterAutoscaler.enabled needs agent.nodeSupply.enabled: Cluster Autoscaler scales the node groups Zenthros supplies" }}
{{- end }}
{{- /*
Cluster Autoscaler for this cluster, with Zenthros as its externalgrpc cloud
provider (operator/docs/design/K8S_NODE_SUPPLY.md). CA dials the agent's
proxy, never the hub: the agent forwards each call on its own connection, so
the hub sees the agent's identity and CA never holds the agent's
certificate. The proxy's trust is local to the cluster: a CA this chart makes
once (kept across upgrades), a server certificate for the proxy's Service and
a client certificate only CA holds.
*/ -}}
{{- $fullname := include "zenthros-agent.fullname" . }}
{{- $proxy := printf "%s-ca-proxy" $fullname }}
{{- $proxyHost := printf "%s.%s.svc" $proxy .Release.Namespace }}
{{- $tlsName := printf "%s-tls" $proxy }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- $tls := dict }}
{{- if and $existing $existing.data (hasKey $existing.data "client.key") }}
{{- $tls = $existing.data }}
{{- else }}
{{- $ca := genCA "zenthros-ca-proxy" 3650 }}
{{- $server := genSignedCert $proxyHost nil (list $proxyHost $proxy) 3650 $ca }}
{{- $client := genSignedCert "cluster-autoscaler" nil nil 3650 $ca }}
{{- $tls = dict "ca.crt" ($ca.Cert | b64enc) "server.crt" ($server.Cert | b64enc) "server.key" ($server.Key | b64enc) "client.crt" ($client.Cert | b64enc) "client.key" ($client.Key | b64enc) }}
{{- end }}
{{- $minor := printf "%s.%s" .Capabilities.KubeVersion.Major (.Capabilities.KubeVersion.Minor | trimSuffix "+") }}
{{- $image := .Values.clusterAutoscaler.image | default (get .Values.clusterAutoscaler.images $minor) }}
{{- if not $image }}
{{- fail (printf "clusterAutoscaler: no Cluster Autoscaler pinned for Kubernetes %s (clusterAutoscaler.images); set clusterAutoscaler.image to one of that minor" $minor) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $tls }}
  {{ $k }}: {{ $v }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $proxy }}
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "zenthros-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: ca-proxy
      port: {{ .Values.clusterAutoscaler.proxyPort }}
      targetPort: ca-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zenthros-cluster-autoscaler
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
---
# RBAC as upstream's cluster-autoscaler-autodiscover example.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zenthros-cluster-autoscaler
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events, endpoints]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [endpoints]
    resourceNames: [cluster-autoscaler]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [watch, list, get, update]
  - apiGroups: [""]
    resources: [namespaces, pods, services, replicationcontrollers, persistentvolumeclaims, persistentvolumes]
    verbs: [watch, list, get]
  - apiGroups: [extensions]
    resources: [replicasets, daemonsets]
    verbs: [watch, list, get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [watch, list]
  - apiGroups: [apps]
    resources: [statefulsets, replicasets, daemonsets]
    verbs: [watch, list, get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, csistoragecapacities, volumeattachments]
    verbs: [watch, list, get]
  - apiGroups: [batch, extensions]
    resources: [jobs]
    verbs: [get, list, watch, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resourceNames: [cluster-autoscaler]
    resources: [leases]
    verbs: [get, update]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims, resourceslices, deviceclasses]
    verbs: [watch, list, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zenthros-cluster-autoscaler
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zenthros-cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: zenthros-cluster-autoscaler
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zenthros-cluster-autoscaler
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status, cluster-autoscaler-priority-expander]
    verbs: [delete, get, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zenthros-cluster-autoscaler
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zenthros-cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: zenthros-cluster-autoscaler
    namespace: {{ .Release.Namespace }}
---
# CA's externalgrpc client sets the TLS server name to the address's host:
# the proxy's Service name, which its certificate names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zenthros-cluster-autoscaler-cloud-config
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
data:
  cloud-config: |
    address: "{{ $proxyHost }}:{{ .Values.clusterAutoscaler.proxyPort }}"
    key: /etc/zenthros/ca-proxy/client.key
    cert: /etc/zenthros/ca-proxy/client.crt
    cacert: /etc/zenthros/ca-proxy/ca.crt
    grpc_timeout: {{ .Values.clusterAutoscaler.grpcTimeout }}
{{- with .Values.clusterAutoscaler.priorities }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-priority-expander
  labels:
    {{- include "zenthros-agent.labels" $ | nindent 4 }}
data:
  priorities: |-
    {{- . | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenthros-cluster-autoscaler
  labels:
    {{- include "zenthros-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cluster-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cluster-autoscaler
      annotations:
        checksum/ca-proxy-tls: {{ toJson $tls | sha256sum }}
    spec:
      serviceAccountName: zenthros-cluster-autoscaler
      {{- include "zenthros-agent.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-autoscaler
          image: {{ $image | quote }}
          command:
            - ./cluster-autoscaler
            - --cloud-provider=externalgrpc
            - --cloud-config=/etc/zenthros/cloud-config/cloud-config
            - --namespace={{ .Release.Namespace }}
            - --scan-interval={{ .Values.clusterAutoscaler.scanInterval }}
            - --expander={{ .Values.clusterAutoscaler.expander }}
            {{- range .Values.clusterAutoscaler.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.clusterAutoscaler.resources | nindent 12 }}
          volumeMounts:
            - {name: cloud-config, mountPath: /etc/zenthros/cloud-config, readOnly: true}
            - {name: ca-proxy-tls, mountPath: /etc/zenthros/ca-proxy, readOnly: true}
      volumes:
        - name: cloud-config
          configMap:
            name: zenthros-cluster-autoscaler-cloud-config
        - name: ca-proxy-tls
          secret:
            secretName: {{ $tlsName }}
            items:
              - {key: ca.crt, path: ca.crt}
              - {key: client.crt, path: client.crt}
              - {key: client.key, path: client.key}
{{- end }}
{{- end }}
