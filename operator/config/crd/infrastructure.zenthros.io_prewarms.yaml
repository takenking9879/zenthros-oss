---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: prewarms.infrastructure.zenthros.io
spec:
  group: infrastructure.zenthros.io
  names:
    kind: Prewarm
    listKind: PrewarmList
    plural: prewarms
    shortNames:
    - pw
    singular: prewarm
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: integer
    - jsonPath: .status.total
      name: Targets
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Prewarm puts images and artifacts on machines before jobs need
          them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PrewarmSpec is what to put on which machines before jobs
              need it.
            properties:
              concurrency:
                default: 4
                description: Concurrency is how many items a machine downloads at
                  once.
                format: int32
                maximum: 16
                minimum: 1
                type: integer
              items:
                items:
                  description: |-
                    PrewarmItem is one thing to warm: exactly one of image, artifact and
                    toolchain.
                  properties:
                    artifact:
                      description: |-
                        PrewarmArtifact is a file jobs find at $ZENTHROS_CACHE_DIR/<path>. It is
                        stored once per host by its digest; a zstd file (.zst) is verified as
                        published and stored decompressed.
                      properties:
                        path:
                          description: Path is the name jobs use, relative to the
                            cache.
                          maxLength: 256
                          pattern: ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
                          type: string
                          x-kubernetes-validations:
                          - message: path cannot contain ..
                            rule: '!self.contains(''..'')'
                        sha256:
                          description: SHA256 is the digest of the bytes at URI.
                          pattern: ^[a-f0-9]{64}$
                          type: string
                        uri:
                          description: |-
                            URI is an http(s) URL; use a presigned URL for object storage. Its
                            query is never repeated in status.
                          maxLength: 4096
                          pattern: ^https?://
                          type: string
                      required:
                      - path
                      - sha256
                      - uri
                      type: object
                    image:
                      description: Image is an OCI image reference, best pinned by
                        digest.
                      maxLength: 512
                      type: string
                    toolchain:
                      description: |-
                        PrewarmToolchain is a host toolchain installed by the agent's installer
                        module (VM backends only).
                      properties:
                        name:
                          enum:
                          - python
                          - node
                          - go
                          - java
                          type: string
                        packages:
                          items:
                            maxLength: 128
                            type: string
                          maxItems: 64
                          type: array
                        version:
                          maxLength: 32
                          type: string
                      required:
                      - name
                      type: object
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of image, artifact and toolchain
                    rule: '(has(self.image) ? 1 : 0) + (has(self.artifact) ? 1 : 0)
                      + (has(self.toolchain) ? 1 : 0) == 1'
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: each artifact needs its own path
                  rule: self.all(x, !has(x.artifact) || self.exists_one(y, has(y.artifact)
                    && y.artifact.path == x.artifact.path))
              kubernetes:
                description: PrewarmKubernetes is how a Kubernetes backend warms.
                properties:
                  image:
                    default: busybox:1.36.1-musl
                    description: |-
                      Image is a static busybox (the -musl variant): the pre-pull pods copy
                      its binary into every image to keep it running, and artifact Jobs use
                      its wget and sha256sum. The default busybox variant is dynamically
                      linked and cannot run inside another image.
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector limits the image pre-pull DaemonSet
                      to these nodes.
                    type: object
                  pvcName:
                    description: |-
                      PVCName is the claim, in the agent's namespace, artifacts are written
                      to. Required for artifacts on a Kubernetes backend.
                    type: string
                type: object
              onNewMembers:
                description: |-
                  OnNewMembers warms each new machine of the targeted pools and fleets
                  before its slot is Ready: a Ready slot is a warm slot. A machine whose
                  warming failed is Ready anyway, with a Prewarmed=False condition.
                type: boolean
              targets:
                description: |-
                  PrewarmTargets selects the backends to warm. Every list adds backends; a
                  Prewarm with no target warms nothing.
                properties:
                  all:
                    description: All warms every enrolled backend.
                    type: boolean
                  backendSelector:
                    description: BackendSelector matches BackendAccess labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  backends:
                    description: Backends are backend ids.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                  fleets:
                    description: Fleets warms every machine of every member of these
                      VMFleets.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                  pools:
                    description: Pools warms every machine of these VMPools.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                type: object
            required:
            - items
            - targets
            type: object
          status:
            description: PrewarmStatus is observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              ready:
                description: Ready and Total count targets.
                format: int32
                type: integer
              targets:
                items:
                  description: PrewarmTargetStatus is one backend's progress.
                  properties:
                    backendID:
                      type: string
                    items:
                      items:
                        description: |-
                          PrewarmItemStatus is one item on one backend. Message is the
                          destination's own text on failure.
                        properties:
                          bytes:
                            format: int64
                            type: integer
                          durationMillis:
                            format: int64
                            type: integer
                          message:
                            type: string
                          phase:
                            type: string
                          ref:
                            type: string
                        required:
                        - phase
                        - ref
                        type: object
                      type: array
                    message:
                      description: Message is why the backend could not be asked (unreachable,
                        refused).
                      type: string
                    phase:
                      description: Phase is Pending, Running, Ready or Failed (any
                        item failed).
                      type: string
                    updatedAt:
                      format: date-time
                      type: string
                  required:
                  - backendID
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - backendID
                x-kubernetes-list-type: map
              total:
                format: int32
                type: integer
            required:
            - ready
            - total
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
