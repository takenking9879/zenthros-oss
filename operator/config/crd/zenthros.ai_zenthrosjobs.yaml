apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: zenthrosjobs.zenthros.ai
spec:
  group: zenthros.ai
  names:
    kind: ZenthrosJob
    listKind: ZenthrosJobList
    plural: zenthrosjobs
    shortNames:
    - zj
    singular: zenthrosjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.backends[0]
      name: Backend
      type: string
    - jsonPath: .spec.workload.kind
      name: Kind
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ZenthrosJob is the domain entity describing a distributed workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZenthrosJobSpec describes intent, not infrastructure.
            properties:
              activeDeadlineSeconds:
                description: |-
                  ActiveDeadlineSeconds is the wall from status.startTime, or from
                  status.submissionTime when start is unset. Empty or zero means no wall.
                  Heartbeats renew the worker-lost lease; they do not move this deadline.
                format: int64
                minimum: 0
                type: integer
              cancel:
                description: |-
                  Cancel stops the job and keeps it: the workload is cancelled, any
                  capacity it held is released, and the ZenthrosJob stays as Cancelled
                  with its history until its TTL. Deleting the ZenthrosJob also cancels,
                  but loses the record. Once true it cannot be set back to false.
                type: boolean
              capacity:
                description: Capacity is the first-seat walk. Omitted acquire uses
                  the mode default.
                properties:
                  acquire:
                    description: |-
                      Acquire is the first-seat walk. Empty/omitted uses the mode default;
                      do not send [].
                    items:
                      description: SeatStep is one walk step for first seat (acquire)
                        or worker-lost (replace).
                      enum:
                      - Backends
                      - Reuse
                      - Create
                      type: string
                    maxItems: 3
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: spec.capacity.acquire must not contain duplicates
                      rule: self.all(x, self.exists_one(y, x == y))
                type: object
              compute:
                description: |-
                  Compute constrains placement. instanceType and purchaseOption apply to
                  Create; CPU/RAM/GPU apply to Reuse/Backends fit. backendKind/region/zone
                  remain scheduler-only when poolRef is set.
                properties:
                  architecture:
                    description: Architecture pins the Catalog architecture, e.g.
                      "x86_64" or "arm64".
                    type: string
                  backendKind:
                    description: BackendKind narrows placement to "k8s", "vm" or "container".
                    enum:
                    - k8s
                    - vm
                    - container
                    type: string
                  cpu:
                    description: CPU is the per-machine vCPU requirement, e.g. "8".
                    type: string
                  gpuCount:
                    description: GPUCount is the minimum accelerator count per machine.
                    format: int32
                    minimum: 0
                    type: integer
                  gpuModel:
                    description: GPUModel pins the accelerator model, e.g. "H100"
                      or "A10G".
                    type: string
                  instanceType:
                    description: |-
                      InstanceType pins Create to a VMPool.spec.instancePolicy.allowedTypes
                      entry. Ignored by Reuse and Backends.
                    type: string
                  lifespan:
                    description: |-
                      Lifespan is Ephemeral (delete native Job/Pod after GC) or Retain (keep the
                      finished object for debug). Empty derives from gcPolicy and pool vs target.
                    enum:
                    - Ephemeral
                    - Retain
                    type: string
                  maxHourlyPriceCents:
                    description: |-
                      MaxHourlyPriceCents is the maximum estimated hourly price, in US cents,
                      accepted for a selected offer. Zero means unconstrained. Cents (not a
                      float) keep the value exact across every API surface.
                    format: int64
                    minimum: 0
                    type: integer
                  memory:
                    description: Memory is the per-machine memory requirement, e.g.
                      "32Gi".
                    type: string
                  purchaseOption:
                    description: |-
                      PurchaseOption restricts the allowed purchase mode. OnDemand permits only
                      On-Demand capacity; Spot permits Spot. Empty permits either.
                    enum:
                    - OnDemand
                    - Spot
                    type: string
                  region:
                    description: Region constrains placement to a provider region.
                    type: string
                  runtime:
                    description: |-
                      Runtime selects how a machine runs the job: on a VM systemd (default),
                      containerd, or workspace-containers; in a container, process. Ignored on
                      k8s backends. Do not infer this from image.
                    enum:
                    - systemd
                    - containerd
                    - workspace-containers
                    - process
                    type: string
                  zone:
                    description: Zone constrains placement to one availability zone
                      within Region.
                    type: string
                type: object
              dependsOn:
                description: DependsOn chains ZenthrosJobs by name for multi-stage
                  pipelines.
                items:
                  type: string
                type: array
              fleetRef:
                description: |-
                  FleetRef names the VMFleet that provides managed capacity: the seat
                  walk tries its member pools, heaviest weight first, within the
                  fleet's constraints. Excludes PoolRef.
                minLength: 1
                type: string
              gcPolicy:
                description: |-
                  GCPolicy controls garbage collection of the job's resources after it
                  finishes (Phase L). Nil applies the controller's configured defaults.
                properties:
                  cleanupPolicy:
                    description: CleanupPolicy selects whether finished resources
                      are deleted or retained.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  retainLogsForSeconds:
                    description: |-
                      RetainLogsForSeconds is how long the backend workload (and therefore its
                      logs) is kept after completion before GC cancels it, independent of the CRD
                      TTL. On k8s pod logs die with the workload; on a VM journald retention
                      bounds how long journal entries survive unit removal.
                    format: int64
                    minimum: 0
                    type: integer
                  retainWorkdir:
                    description: |-
                      RetainWorkdir keeps the VM work directory (/var/lib/zenthros/jobs/<id>)
                      when the job is cleaned up. Ignored by the k8s backend.
                    type: boolean
                  ttlSecondsAfterFinished:
                    description: |-
                      TTLSecondsAfterFinished is how long the CRD is kept after the job reaches a
                      terminal phase before GC deletes it. Deletion cascades workload cleanup via
                      the finalizer, so it also bounds the workload's lifetime. 0 deletes as soon
                      as the job finishes.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              placement:
                description: |-
                  Placement constrains where the job's seats go: with or apart from
                  other jobs, spread over zones or regions, only in some regions.
                properties:
                  affinity:
                    description: |-
                      Affinity seats the job in the same domain as another job's seat (data
                      locality, same machine as a producer).
                    items:
                      description: |-
                        JobAffinityTerm names other jobs, in this job's namespace, by name or by
                        labels.
                      properties:
                        jobName:
                          type: string
                        jobSelector:
                          description: |-
                            A label selector is a label query over a set of resources. The result of matchLabels and
                            matchExpressions are ANDed. An empty label selector matches all objects. A null
                            label selector matches no objects.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                        topologyKey:
                          description: "TopologyKey names a placement domain. Every
                            seat has one per key:\n\n\tmachine   the backend (one
                            VM, one cluster)\n\tzone      the failure domain (AWS
                            availability zone, GCP zone)\n\tregion    the provider
                            region\n\tprovider  the cloud provider, or the operator's
                            name for a site\n\nManaged machines take zone, region
                            and provider from their CapacityRequest;\nmachines brought
                            by their owner from BackendAccess.spec.compute (zone,\nregion)
                            and its topology.zenthros.ai/provider label, which the
                            operator\nsets, and otherwise from what the agent observed
                            (instance metadata)."
                          enum:
                          - machine
                          - zone
                          - region
                          - provider
                          type: string
                      required:
                      - topologyKey
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of jobName and jobSelector
                        rule: (has(self.jobName) && size(self.jobName) > 0) != has(self.jobSelector)
                    maxItems: 8
                    type: array
                  antiAffinity:
                    description: AntiAffinity keeps the job out of every domain a
                      matching job is in.
                    items:
                      description: |-
                        JobAffinityTerm names other jobs, in this job's namespace, by name or by
                        labels.
                      properties:
                        jobName:
                          type: string
                        jobSelector:
                          description: |-
                            A label selector is a label query over a set of resources. The result of matchLabels and
                            matchExpressions are ANDed. An empty label selector matches all objects. A null
                            label selector matches no objects.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                        topologyKey:
                          description: "TopologyKey names a placement domain. Every
                            seat has one per key:\n\n\tmachine   the backend (one
                            VM, one cluster)\n\tzone      the failure domain (AWS
                            availability zone, GCP zone)\n\tregion    the provider
                            region\n\tprovider  the cloud provider, or the operator's
                            name for a site\n\nManaged machines take zone, region
                            and provider from their CapacityRequest;\nmachines brought
                            by their owner from BackendAccess.spec.compute (zone,\nregion)
                            and its topology.zenthros.ai/provider label, which the
                            operator\nsets, and otherwise from what the agent observed
                            (instance metadata)."
                          enum:
                          - machine
                          - zone
                          - region
                          - provider
                          type: string
                      required:
                      - topologyKey
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of jobName and jobSelector
                        rule: (has(self.jobName) && size(self.jobName) > 0) != has(self.jobSelector)
                    maxItems: 8
                    type: array
                  pack:
                    description: |-
                      Pack puts every member of the job in one domain (one zone, one
                      machine). It concerns the members of a distributed job.
                    properties:
                      topologyKey:
                        description: "TopologyKey names a placement domain. Every
                          seat has one per key:\n\n\tmachine   the backend (one VM,
                          one cluster)\n\tzone      the failure domain (AWS availability
                          zone, GCP zone)\n\tregion    the provider region\n\tprovider
                          \ the cloud provider, or the operator's name for a site\n\nManaged
                          machines take zone, region and provider from their CapacityRequest;\nmachines
                          brought by their owner from BackendAccess.spec.compute (zone,\nregion)
                          and its topology.zenthros.ai/provider label, which the operator\nsets,
                          and otherwise from what the agent observed (instance metadata)."
                        enum:
                        - machine
                        - zone
                        - region
                        - provider
                        type: string
                    required:
                    - topologyKey
                    type: object
                  regions:
                    description: Regions allows only seats in these regions.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                  separateMachines:
                    description: |-
                      SeparateMachines puts each member of a distributed job on its own
                      machine. Default true for distributed jobs.
                    type: boolean
                  spread:
                    description: |-
                      Spread keeps the jobs JobSelector matches (this one included) balanced
                      across domains: after this job is seated, no domain has more than
                      maxSkew jobs over the least loaded one.
                    items:
                      description: SpreadRule balances matching jobs across domains
                        of TopologyKey.
                      properties:
                        jobSelector:
                          description: |-
                            JobSelector picks the jobs, in this job's namespace, that are counted.
                            Empty counts the jobs with all of this job's labels.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                        maxSkew:
                          default: 1
                          description: MaxSkew is the most a domain may have over
                            the least loaded one.
                          format: int32
                          minimum: 1
                          type: integer
                        minDomains:
                          description: |-
                            MinDomains counts domains that have no matching job and no candidate
                            seat as empty until there are this many: with minDomains 2 and one
                            zone to offer, a second job does not go to the same zone.
                          format: int32
                          minimum: 1
                          type: integer
                        topologyKey:
                          description: "TopologyKey names a placement domain. Every
                            seat has one per key:\n\n\tmachine   the backend (one
                            VM, one cluster)\n\tzone      the failure domain (AWS
                            availability zone, GCP zone)\n\tregion    the provider
                            region\n\tprovider  the cloud provider, or the operator's
                            name for a site\n\nManaged machines take zone, region
                            and provider from their CapacityRequest;\nmachines brought
                            by their owner from BackendAccess.spec.compute (zone,\nregion)
                            and its topology.zenthros.ai/provider label, which the
                            operator\nsets, and otherwise from what the agent observed
                            (instance metadata)."
                          enum:
                          - machine
                          - zone
                          - region
                          - provider
                          type: string
                      required:
                      - topologyKey
                      type: object
                    maxItems: 4
                    type: array
                type: object
              poolRef:
                description: |-
                  PoolRef names the VMPool that must provide managed capacity for this
                  job. Combines with Target.Backends.
                minLength: 1
                type: string
              priority:
                description: |-
                  Priority ranks waiters of the same exclusive unit. Higher admits first.
                  Equal priority stays FIFO (creationTimestamp, then name). Occupancy 1/1
                  for exclusive VM/raycluster is unchanged. It ranks one Workspace's own
                  jobs only: while jobs of several Workspaces wait for a unit, the queue
                  is FIFO.
                format: int32
                minimum: 0
                type: integer
              resilience:
                description: |-
                  Resilience controls worker-lost recovery. It is not RetryPolicy (submit
                  backoff) and not gcPolicy (post-success cleanup).
                properties:
                  jobGrace:
                    description: |-
                      JobGrace is the Allocated/running silence window before WORKER_LOST.
                      Empty uses the cluster default (45s). Must be at least twice the
                      heartbeat interval; shorter values are raised to that floor.
                    type: string
                  onWorkerLost:
                    default: Reschedule
                    description: |-
                      OnWorkerLost is Fail or Reschedule. Empty defaults to Reschedule.
                      Fail ignores Replace.
                    enum:
                    - Fail
                    - Reschedule
                    type: string
                  preemptNotice:
                    description: |-
                      PreemptNotice says how the process learns its machine is being taken
                      back. The agent always writes the notice to $ZENTHROS_PREEMPT_FILE; a
                      signal is sent only when asked for here.
                    properties:
                      signal:
                        description: |-
                          Signal is sent to the process after the notice file is written.
                          Empty sends none: the process polls the file (the SDK does).
                        enum:
                        - SIGTERM
                        - SIGINT
                        - SIGUSR1
                        - SIGUSR2
                        type: string
                    type: object
                  replace:
                    description: |-
                      Replace is the worker-lost walk. Empty/omitted uses the mode default;
                      do not send []. Ignored when OnWorkerLost is Fail.
                    items:
                      description: SeatStep is one walk step for first seat (acquire)
                        or worker-lost (replace).
                      enum:
                      - Backends
                      - Reuse
                      - Create
                      type: string
                    maxItems: 3
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: spec.resilience.replace must not contain duplicates
                      rule: self.all(x, self.exists_one(y, x == y))
                  workerLostRetryLimit:
                    default: 3
                    description: WorkerLostRetryLimit bounds Reschedule replacements.
                      Empty defaults to 3.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              resumeFrom:
                description: |-
                  ResumeFrom starts this job from the last acked checkpoint of an ended job
                  of its namespace. It names the job, never a place: the controller reads
                  the cursor, and the runner checks each blob against its digest.
                properties:
                  job:
                    description: Job is the name of a job of this namespace.
                    minLength: 1
                    type: string
                  uid:
                    description: 'UID is that job''s: another job of the same name
                      is another job.'
                    minLength: 1
                    type: string
                required:
                - job
                - uid
                type: object
              target:
                description: Target selects enrolled backends. Combines with PoolRef.
                properties:
                  backends:
                    description: |-
                      Backends is the ordered enrolled backend id list. Token any is last-only
                      and means Scheduler among enrolled backends outside the named prefix.
                    items:
                      maxLength: 253
                      minLength: 1
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                  rayCluster:
                    description: |-
                      RayCluster runs this RayJob on an existing RayCluster instead of a
                      dedicated one. The cluster must be in the job's namespace on the one
                      backend named in Backends. Zenthros owns only the per-job RayJob and
                      never changes the cluster.
                    properties:
                      name:
                        description: Name is the exact RayCluster name.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace must equal the ZenthrosJob namespace. It is explicit so a
                          cross-Workspace reference is rejected rather than silently redirected.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                type: object
                x-kubernetes-validations:
                - message: spec.target.backends must be unique
                  rule: '!has(self.backends) || self.backends.all(x, self.backends.exists_one(y,
                    x == y))'
                - message: any may appear only last in spec.target.backends
                  rule: '!has(self.backends) || size(self.backends.filter(x, x ==
                    ''any'')) == 0 || (size(self.backends.filter(x, x == ''any''))
                    == 1 && self.backends[self.backends.size()-1] == ''any'')'
              workload:
                description: Workload is the logical work to execute.
                properties:
                  kind:
                    description: Kind selects the native resource the adapter creates.
                    enum:
                    - Job
                    - RayJob
                    - RayCluster
                    - SparkApplication
                    - Manifest
                    type: string
                  template:
                    description: Template is the logical workload specification.
                    properties:
                      args:
                        description: |-
                          Args are appended to Command verbatim (no shell interpretation). Only valid
                          with Command.
                        items:
                          type: string
                        type: array
                      artifacts:
                        description: Artifacts references object-storage URIs for
                          inputs and outputs.
                        properties:
                          input:
                            description: Input URI, e.g. s3://bucket/dataset.
                            type: string
                          output:
                            description: Output URI, e.g. s3://bucket/models.
                            type: string
                        type: object
                      command:
                        description: |-
                          Command is the structured executable, e.g. ["python", "train.py"]. Mutually
                          exclusive with Entrypoint. Tokens pass to the backend uninterpreted by any
                          shell: k8s renders them quoted into the RayJob entrypoint, a VM runs them
                          directly as the systemd ExecStart.
                        items:
                          type: string
                        minItems: 1
                        type: array
                      distribution:
                        description: |-
                          Distribution splits the Job into Independent tasks across machines.
                          Workers still sizes each task.
                        properties:
                          count:
                            description: Count is how many tasks run.
                            format: int32
                            maximum: 256
                            minimum: 1
                            type: integer
                          failurePolicy:
                            description: FailurePolicy is FailFast (default) or ContinueOnFailure.
                            enum:
                            - FailFast
                            - ContinueOnFailure
                            type: string
                          mode:
                            description: Mode is Independent.
                            enum:
                            - Independent
                            type: string
                          tasksPerNode:
                            description: |-
                              TasksPerNode is how many tasks may share one machine; the machine must
                              run that many jobs at once. Default 1.
                            format: int32
                            maximum: 64
                            minimum: 1
                            type: integer
                        required:
                        - count
                        - mode
                        type: object
                      entrypoint:
                        description: |-
                          Entrypoint is the shell string submitted to the engine, e.g. "python train.py".
                          Mutually exclusive with the structured Command; prefer Command, which runs
                          without shell interpretation (Phase O).
                        type: string
                      env:
                        description: Env holds plain name/value pairs injected into
                          the workload process.
                        items:
                          description: EnvVar is a plain environment variable.
                          properties:
                            name:
                              description: Name is a POSIX environment variable name.
                              maxLength: 256
                              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                              type: string
                            value:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      image:
                        description: |-
                          Image is the runtime-only container image (no user code baked in): an
                          OCI reference, [registry[:port]/]path[:tag][@digest]. Agents hand it to
                          root-run tooling, so nothing outside that grammar is admitted. A Job
                          that runs as a process on the machine (runtime systemd) needs none;
                          every containerized runtime does, which admission checks once the
