            - message: 'spec.placement does not apply to a Manifest: its object says
                where its pods run'
              rule: '!has(self.placement) || self.workload.kind != ''Manifest'''
            - message: a Service runs until it is cancelled; spec.activeDeadlineSeconds
                does not apply
              rule: '!has(self.workload.template.service) || !has(self.activeDeadlineSeconds)'
            - message: 'a Service needs spec.poolRef, spec.fleetRef or spec.target.backends:
                its ports are published by the pool or machine it runs on'
