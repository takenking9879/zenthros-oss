              rule: '!(has(self.capacity) && has(self.capacity.acquire) && (''Backends''
                in self.capacity.acquire) && !(has(self.target) && has(self.target.backends)
                && size(self.target.backends) > 0))'
            - message: spec.capacity.acquire Reuse/Create require spec.poolRef, spec.fleetRef
                or scheduler mode
              rule: '!(has(self.capacity) && has(self.capacity.acquire) && ((''Reuse''
                in self.capacity.acquire) || (''Create'' in self.capacity.acquire))
                && !(has(self.poolRef) && size(self.poolRef) > 0) && !has(self.fleetRef)
                && has(self.target) && has(self.target.backends) && size(self.target.backends)
                > 0)'
            - message: spec.resilience.replace Backends requires spec.target.backends
              rule: '!(has(self.resilience) && has(self.resilience.replace) && (''Backends''
                in self.resilience.replace) && !(has(self.target) && has(self.target.backends)
                && size(self.target.backends) > 0))'
            - message: spec.resilience.replace Reuse/Create require spec.poolRef,
                spec.fleetRef or scheduler mode
              rule: '!(has(self.resilience) && has(self.resilience.replace) && ((''Reuse''
                in self.resilience.replace) || (''Create'' in self.resilience.replace))
                && !(has(self.poolRef) && size(self.poolRef) > 0) && !has(self.fleetRef)
                && has(self.target) && has(self.target.backends) && size(self.target.backends)
                > 0)'
            - message: spec.fleetRef and spec.poolRef are exclusive
              rule: '!has(self.fleetRef) || !has(self.poolRef) || size(self.poolRef)
                == 0'
            - message: 'a distributed job needs spec.target.backends, spec.poolRef
                or spec.fleetRef: the Scheduler keeps its members apart among the
                places it names'
              rule: '!has(self.workload.template.distribution) || self.workload.template.distribution.count
                <= 1 || (has(self.poolRef) && size(self.poolRef) > 0) || has(self.fleetRef)
                || (has(self.target) && has(self.target.backends) && size(self.target.backends)
                > 0)'
            - message: spec.target.rayCluster cannot be combined with spec.fleetRef
              rule: '!has(self.fleetRef) || !(has(self.target) && has(self.target.rayCluster))'
            - message: 'spec.placement does not apply to a RayJob on spec.target.rayCluster:
                its pods are the standing cluster''s'
