<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenthros</title>
<style nonce="__NONCE__">
:root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#deded8; --accent:#2f5bd3; --ok:#1f7a4a; --bad:#b3261e; --warn:#8a5a00; --code:#f0f0ec; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1e1e1c; --ink:#e8e8e3; --muted:#9a9a93; --line:#34342f; --accent:#7d9cf0; --ok:#5cc28c; --bad:#f08a80; --warn:#e0b35a; --code:#262623; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1 { font-size:16px; margin:0; }
nav { display:flex; gap:4px; flex-wrap:wrap; }
nav button { font:inherit; color:var(--muted); background:none; border:0; border-bottom:2px solid transparent; padding:6px 10px; cursor:pointer; }
nav button:hover { color:var(--ink); }
nav button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
button:focus-visible, input:focus-visible, tr:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
#seen { margin-left:auto; color:var(--muted); font-size:12px; }
main { padding:16px 20px; max-width:1200px; margin:auto; }
#error { display:none; background:var(--panel); border:1px solid var(--bad); border-radius:6px; padding:8px 12px; margin-bottom:12px; }
#error.shown { display:block; }
.scroll { overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
th { color:var(--muted); font-weight:500; font-size:12px; }
tr:last-child td { border-bottom:0; }
tbody tr.open { cursor:pointer; }
tbody tr.open:hover, tbody tr.chosen { background:var(--code); }
td.long { white-space:normal; overflow-wrap:anywhere; min-width:12em; }
code { font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; }
.state { font-weight:500; }
.state.ok { color:var(--ok); } .state.bad { color:var(--bad); } .state.warn { color:var(--warn); } .state.idle { color:var(--muted); }
.empty { padding:24px; color:var(--muted); text-align:center; }
#job { display:none; margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 16px; }
#job.shown { display:block; }
#job h2 { font-size:14px; margin:0 0 8px; overflow-wrap:anywhere; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:2px 16px; margin:0 0 12px; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
.filter { display:flex; gap:8px; align-items:center; margin-bottom:6px; color:var(--muted); }
input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:3px 8px; min-width:16em; }
pre { margin:0; padding:10px 12px; background:var(--code); border-radius:4px; max-height:420px; overflow:auto; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <h1>Zenthros</h1>
  <nav role="tablist" id="tabs"></nav>
  <span id="seen" aria-live="polite"></span>
</header>
<main>
  <div id="error" role="alert"></div>
  <div class="scroll"><div id="table"></div></div>
  <section id="job" aria-label="One job">
    <h2 id="job-name"></h2>
    <dl id="job-facts"></dl>
    <label class="filter">Lines that match <input id="grep" placeholder="a regular expression" spellcheck="false"></label>
    <pre id="job-log"></pre>
  </section>
</main>
<script nonce="__NONCE__">
"use strict";
// Everything a job or a machine says reaches the page as text, never as markup.
const here = new URL(location.href);
const token = here.searchParams.get("token") || sessionStorage.getItem("zenthros-ui") || "";
sessionStorage.setItem("zenthros-ui", token);
history.replaceState(null, "", "/");

const $ = id => document.getElementById(id);
function el(tag, text, className) {
  const made = document.createElement(tag);
  if (text !== undefined && text !== null) made.textContent = String(text);
  if (className) made.className = className;
  return made;
}
async function ask(path) {
  const answer = await fetch(path, {headers: {"X-Zenthros-Token": token}});
  const body = await answer.json();
  if (!answer.ok) throw new Error(body.error || answer.statusText);
  return body;
}
function state(value) {
  const name = String(value || "");
  const kind = {succeeded: "ok", available: "ok", ready: "ok", good: "ok", failed: "bad", offline: "bad", unavailable: "bad", cancelled: "idle",
                running: "warn", queued: "idle", pending: "idle", full: "warn"}[name.toLowerCase()] || "idle";
  const mark = {ok: "✓ ", bad: "✗ ", warn: "● ", idle: "○ "}[kind];
  return el("span", mark + name, "state " + kind);
}
function table(columns, rows, empty, open) {
  const box = $("table");
  box.replaceChildren();
  if (!rows.length) { box.append(el("div", empty, "empty")); return; }
  const made = el("table"), head = el("tr"), body = el("tbody");
  for (const column of columns) { const th = el("th", column.title); th.scope = "col"; head.append(th); }
  const thead = el("thead"); thead.append(head); made.append(thead, body);
  for (const row of rows) {
    const line = el("tr");
    for (const column of columns) {
      const value = column.get(row);
      const cell = el("td", undefined, column.long ? "long" : "");
      if (value instanceof Node) cell.append(value); else cell.textContent = value === undefined || value === null ? "" : String(value);
      line.append(cell);
    }
    if (open) {
      line.className = "open" + (open.chosen(row) ? " chosen" : "");
      line.tabIndex = 0;
      line.onclick = () => open.go(row);
      line.onkeydown = event => { if (event.key === "Enter") open.go(row); };
    }
    body.append(line);
  }
  box.append(made);
}
function when(text) {
  if (!text) return "";
  const at = new Date(text);
  return isNaN(at) ? text : at.toLocaleString();
}
function list(items) { return (items || []).join(", "); }

let chosen = "";
const views = {
  Jobs: async () => {
    const answer = await ask("/api/jobs?limit=100");
    if (answer.unreachable && answer.unreachable.length) problem("Not reached: " + answer.unreachable.join("; "));
    table([
      {title: "Job", get: row => el("code", row.job)},
      {title: "State", get: row => state(row.state)},
      {title: "Exit", get: row => row.exit_code},
      {title: "Reason", get: row => row.reason},
      {title: "Pipeline", get: row => row.pipeline ? row.pipeline + " · " + row.step : ""},
      {title: "Created", get: row => when(row.created)},
    ], answer.jobs, "No jobs yet. zenthros run hola.py sends one.", {chosen: row => row.job === chosen, go: row => choose(row.job)});
  },
  Targets: async () => {
    table([
      {title: "Name", get: row => el("code", row.name)},
      {title: "Type", get: row => row.type},
      {title: "State", get: row => state(row.status)},
      {title: "Why", get: row => row.reason, long: true},
      {title: "Machines", get: row => row.total ? row.available + " of " + row.total : ""},
      {title: "CPUs", get: row => row.cpu || ""},
      {title: "Memory", get: row => row.memory_gib ? row.memory_gib + " GiB" : ""},
      {title: "GPU", get: row => row.gpus ? row.gpus + " " + (row.gpu_model || "") : ""},
      {title: "Per hour", get: row => row.price_per_hour ? "$" + row.price_per_hour : row.costs ? "" : "free"},
      {title: "Agents", get: row => row.allowed ? "may use it" : row.to_allow || "", long: true},
      {title: "Environments", get: row => list(row.environments), long: true},
    ], await ask("/api/targets"), "Nowhere to run yet.");
  },
  Environments: async () => {
    const answer = await ask("/api/environments");
    table([
      {title: "Name", get: row => el("code", (row.in_use ? "* " : "") + row.name)},
      {title: "Base", get: row => row.base},
      {title: "Packages", get: row => row.packages},
      {title: "Python", get: row => row.python},
      {title: "Content", get: row => row.content ? el("code", row.content.slice(0, 19)) : "not built"},
      {title: "Published", get: row => list(row.published), long: true},
    ], answer.environments, "No environments. zenthros env new NAME --from IMAGE makes one.");
  },
  Cache: async () => {
    const answer = await ask("/api/cache");
    table([
      {title: "Key", get: row => el("code", String(row.key).slice(0, 12))},
      {title: "Function", get: row => row.fn},
      {title: "Job", get: row => row.job},
      {title: "When", get: row => when(row.at)},
      {title: "State", get: row => state(row.valid ? "good" : "failed")},
      {title: "Why not", get: row => row.problem, long: true},
    ], answer.entries, "Nothing in the cache. cache=True keeps a result here.");
  },
};
let view = "Jobs";
function problem(text) { const box = $("error"); box.textContent = text; box.classList.toggle("shown", !!text); }
async function refresh() {
  try {
    problem("");
    await views[view]();
    if (view === "Jobs" && chosen) await showJob();
    $("seen").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (error) { problem(error.message); }
}
function tabs() {
  const bar = $("tabs");
  bar.replaceChildren();
  for (const name of Object.keys(views)) {
    const tab = el("button", name);
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(name === view));
    tab.onclick = () => { view = name; if (name !== "Jobs") { chosen = ""; $("job").classList.remove("shown"); } tabs(); $("table").replaceChildren(); refresh(); };
    bar.append(tab);
  }
}
async function showJob() {
  const name = encodeURIComponent(chosen);
  const facts = await ask("/api/jobs/" + name);
  $("job-name").textContent = chosen;
  const shown = $("job-facts");
  shown.replaceChildren();
  for (const key of ["state", "exit_code", "reason", "message", "took_s", "cost_usd", "machine", "code", "pipeline", "step"]) {
    if (facts[key] === undefined || facts[key] === null || facts[key] === "") continue;
    shown.append(el("dt", key.replace("_", " ")), el("dd", facts[key]));
  }
  for (const artifact of facts.artifacts || []) shown.append(el("dt", "artifact"), el("dd", artifact));
  const grep = $("grep").value;
  try {
    const log = await ask("/api/jobs/" + name + "/logs?limit=500" + (grep ? "&grep=" + encodeURIComponent(grep) : ""));
    $("job-log").textContent = log.lines.join("\n") || "(no lines)";
  } catch (error) { $("job-log").textContent = error.message; }
  $("job").classList.add("shown");
}
function choose(name) { chosen = name; refresh(); }
$("grep").onchange = () => refresh();
tabs();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
</script>
</body>
</html>
